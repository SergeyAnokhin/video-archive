# SPA fallback: any non-file path serves index.html so client-side routing
# works on refresh/deep-link. /api never reaches nginx — the Traefik Ingress
# routes it straight to the backend Service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
