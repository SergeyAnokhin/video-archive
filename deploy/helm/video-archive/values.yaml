# The only file CI mutates: .github/workflows/build.yml rewrites
# image.backend.tag / image.frontend.tag on every green build of main and
# force-pushes the result to the `deploy` branch that ArgoCD tracks.
fullnameOverride: "video-archive"

image:
  registry: ghcr.io/sergeyanokhin/video-archive # lowercase, one repo -> many component images
  pullPolicy: IfNotPresent
  backend: { repository: backend, tag: "REPLACED_BY_CI" }
  frontend: { repository: frontend, tag: "REPLACED_BY_CI" }
imagePullSecrets: [] # [{name: ghcr-creds}] only if the GHCR packages stay private

backend:
  replicas: 1 # stateful (SQLite on the PVC) -> keep at 1, strategy Recreate
  service: { port: 8000 }
  # Node placement: soft preference, not a hard requirement. When true, the
  # backend *prefers* the powerful node (`ubuntu-server`, label role=compute)
  # at scheduling time, and falls back to the general-purpose node (`k3s`)
  # automatically if the compute node isn't schedulable right then — no
  # manual flag flip needed. Set false for no preference either way.
  # CAUTION: this only affects *scheduling decisions* (pod/PVC creation).
  # The state PVC below is k3s local-path, i.e. pinned to whichever node it
  # first bound on — once bound, the backend can only run on that node until
  # the PVC is recreated, regardless of this preference. It does NOT give
  # live failover if the node the PVC is already on goes down. See
  # docs/deployment.md "Node placement".
  preferComputeNode: true
  # No limits/requests were set before (chat request: backend was getting
  # OOMKilled repeatedly with no resources block at all -- Kubernetes could
  # only respond by starving the whole *node*, not the pod's own cgroup).
  # `limits.memory` is a starter value with headroom above the ~5.9Gi RSS
  # observed via k9s during a heavy convert/preview job -- verify against
  # `kubectl describe node ubuntu-server` (Allocatable) and tune once the
  # resource-monitor samples in backend.log (see app/resource_monitor.py)
  # show the real steady-state profile.
  resources:
    requests: { memory: 512Mi, cpu: 250m }
    limits: { memory: 7Gi }
  # Mutable state (SQLite DB, secrets.env, preview cache, detection models,
  # logs) — mounted at stateDir, injected as VIDEO_ARCHIVE_STATE_DIR.
  stateDir: /data/state
  state:
    size: 20Gi
    storageClass: "" # "" = cluster default (k3s local-path, RWO, node-local)

frontend:
  replicas: 1
  service: { port: 80 }

ingress:
  enabled: true
  className: traefik
  host: video-archive.192.168.1.97.nip.io # nip.io -> no DNS/router config needed
  tls: true # HTTPS via cert-manager
  certIssuer: home-ca # ClusterIssuer already on the cluster
  # No StripPrefix middleware: the backend already serves every route under
  # /api (FastAPI routers use prefix="/api"), so /api must be forwarded as-is.
