apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "video-archive.fullname" . }}-frontend
  labels:
    {{- include "video-archive.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  # Keep only a few old ReplicaSets around (CI deploys on every green main
  # build, so the default of 10 clutters the ArgoCD resource tree fast).
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "video-archive.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "video-archive.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
