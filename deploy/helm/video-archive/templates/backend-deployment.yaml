apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "video-archive.fullname" . }}-backend
  labels:
    {{- include "video-archive.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Stateful (SQLite + caches on a node-local RWO PVC): single replica and
  # Recreate so two pods never hold the DB at once.
  replicas: {{ .Values.backend.replicas }}
  # Keep only a few old ReplicaSets around (CI deploys on every green main
  # build, so the default of 10 clutters the ArgoCD resource tree fast).
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "video-archive.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Always tolerate the compute-node taint so the scheduler is *allowed*
      # to place the pod there — this alone doesn't request that node.
      tolerations:
        - key: role
          operator: Equal
          value: compute
          effect: NoSchedule
      {{- if .Values.backend.preferComputeNode }}
      # Soft preference (see values.yaml backend.preferComputeNode): try
      # ubuntu-server first, fall back to any other node automatically if
      # it isn't schedulable right now.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values: [compute]
      {{- end }}
      containers:
        - name: backend
          image: {{ include "video-archive.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: VIDEO_ARCHIVE_STATE_DIR
              value: {{ .Values.backend.stateDir | quote }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: {{ .Values.backend.stateDir }}
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "video-archive.fullname" . }}-state
